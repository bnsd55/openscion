# The supply-chain check: advisories (RustSec), licenses, bans, sources.

[advisories]
version = 2
# An unsound advisory fails, in any dependency ("all": direct or
# transitive) - the supply-chain floor the Scorecard gate measures, set
# here so CI's deny check catches the next one before Scorecard does.
unsound = "all"
# Yanked releases anywhere in the tree are noted, not fatal. An
# unmaintained direct dependency fails, so it gets acted on; an
# unmaintained transitive one is only noted, so an upstream flag cannot
# turn every PR red with no code change to make.
yanked = "warn"
unmaintained = "workspace"
ignore = [
    # heapless 0.8.0 carries nine unsoundness advisories (RUSTSEC-2026-0574
    # through -0582), but none of the unsound code is reachable: it rides in
    # through gix-hash -> faster-hex 0.10.1, whose only use of heapless
    # (src/encode.rs:13) is cfg(not(feature = "alloc")), and gix-hash turns
    # faster-hex's alloc feature on, so the line is compiled out. faster-hex
    # 1.x makes heapless optional, but no gix-hash release uses it yet. Remove
    # these when gix-hash moves to faster-hex 1.x, or when heapless 0.8 gets
    # a fixed release.
    { id = "RUSTSEC-2026-0574", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0575", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0576", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0577", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0578", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0579", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0580", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0581", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
    { id = "RUSTSEC-2026-0582", reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)" },
]

[licenses]
version = 2
# The license of this project is `MIT OR Apache-2.0` (workspace Cargo.toml).
# The list below is the license set of the dependency tree as of the first
# check; a new dependency under a different license is a change to review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # zstd-sys 2.1.3 declares "BSD-3-Clause AND BSD-2-Clause"; BSD-2-Clause
    # is permissive, OSI-approved, and compatible with MIT OR Apache-2.0.
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
