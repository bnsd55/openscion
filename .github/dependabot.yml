version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # rusqlite 0.41 needs Rust 1.89, above the 1.88 MSRV; lift this
      # when the MSRV rises (stability.md moves the floor on purpose).
      - dependency-name: rusqlite
        versions: [">= 0.41"]
    groups:
      cargo:
        patterns: ["*"]
  # Each fuzz sub-workspace holds its own Cargo.lock, which the root
  # entry never reads (it did: the gix advisory rode a fuzz lock after
  # the root moved). The same schedule and grouping as "/"; a fuzz
  # crate's dependency bump lands as its own grouped PR.
  - package-ecosystem: cargo
    directory: /crates/scion-core/fuzz
    schedule:
      interval: weekly
    ignore:
      # rusqlite 0.41 needs Rust 1.89, above the 1.88 MSRV; lift this
      # when the MSRV rises. (Core's own lock carries no rusqlite; the
      # ignore keeps the entry correct if one ever lands.)
      - dependency-name: rusqlite
        versions: [">= 0.41"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /crates/scion-proto/fuzz
    schedule:
      interval: weekly
    ignore:
      - dependency-name: rusqlite
        versions: [">= 0.41"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /crates/scion-server/fuzz
    schedule:
      interval: weekly
    ignore:
      # rusqlite 0.41 needs Rust 1.89, above the 1.88 MSRV; lift this
      # when the MSRV rises. Its lock holds 0.40.2 through the tier.
      - dependency-name: rusqlite
        versions: [">= 0.41"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /crates/scion-tier/fuzz
    schedule:
      interval: weekly
    ignore:
      # rusqlite 0.41 needs Rust 1.89, above the 1.88 MSRV; lift this
      # when the MSRV rises.
      - dependency-name: rusqlite
        versions: [">= 0.41"]
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Refs like @1.88 and @stable name toolchains, not action versions;
      # @1.88 is the MSRV and must not move.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
