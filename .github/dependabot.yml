version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  # The four fuzz sub-workspaces (crates/*/fuzz) have no entry here on
  # purpose: Dependabot's updater resolves inside a copy that lacks the
  # root workspace manifest, and a fuzz crate's path dependency inherits
  # from that manifest, so an update that needs resolution dies with
  # "failed to find a workspace root" (#1245). Their lockfiles are
  # covered instead by the deny loop in ci.yml (an advisory fails red
  # weekly) and by the manual upkeep step in docs/fuzzing.md
  # ("Dependency upkeep").
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Refs like @1.89 and @stable name toolchains, not action versions;
      # @1.89 is the MSRV and must not move.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
