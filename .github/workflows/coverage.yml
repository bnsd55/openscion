# The statement-coverage gate: the roadmap's v0.8.0 bar, measured over
# production code with a pinned tool, the exclusions checked in
# (scripts/coverage-exclusions.txt). One Postgres job runs the whole
# workspace against the pg17 service (every suite is Postgres now), it
# uploads its profiles, and the gate job rebuilds the instrumented
# binaries without tests and turns the upload into the one number it
# checks. The build links two objects at a time and the suite runs two
# tests at a time, because the instrumented build plus the whole suite
# is the heaviest thing this repository runs and the runner's agent
# dies of memory when the machine is pushed harder.
#
# No pull_request trigger on purpose: the PR lane does not pay for the
# coverage build, and an edit to this file is not a workflow-lane PR
# that every open PR must merge. The same reason bench.yml and soak.yml
# are their own files.

name: coverage
on:
  push:
    branches: [main]
  workflow_dispatch:

# Every third-party action is pinned to the commit SHA its version tag
# named, with the version in a comment, as ci.yml does.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  # An A/B dispatch carries its own group (the run id), so several can
  # run in parallel; a push to main shares one group - a run in
  # progress finishes and verifies the head it ran on. (This file has
  # no pull_request trigger, so the expression
  # reads false on main.)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  # Everything the measure writes stays under the worktree's own target
  # dir; nothing goes to /tmp (the run that filled the runner's disk
  # wrote there).
  CARGO_LLVM_COV_TARGET_DIR: target/coverage
  # The instrumented build plus the whole suite is the heaviest thing
  # this repository runs, on a runner whose agent dies of memory: the
  # build links two objects at a time, the suite runs two tests at a
  # time, incremental compilation is off (the instrumented build is
  # rebuilt once and cached anyway), and the measure job's own cap is
  # 90 minutes, above the suite's measured wall but below the hour
  # where the agent stops answering.
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"
  CARGO_INCREMENTAL: "0"

jobs:
  measure:
    name: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: protoc
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # The instrumented build is one build, saved even on a failed
          # run, so one green build turns every later run into the warm
          # measure.
          key: coverage-instrumented
          cache-on-failure: true
          cache-targets: false
      - run: |
          curl -fsSL -o /tmp/cargo-llvm-cov.tgz \
            https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  /tmp/cargo-llvm-cov.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/cargo-llvm-cov.tgz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          # An empty file holds no patterns, and an empty regex would
          # match everything: the flag is passed only when a pattern
          # exists.
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      # A vacuous exclusion is the same bug class as the soak's zero
      # counts: a pattern that matches no tracked file excludes nothing
      # and promises a number the report does not hold.
      - name: every exclusion pattern matches a tracked file
        run: |
          ok=1
          while IFS= read -r pattern; do
            if ! git ls-files | grep -qE "$pattern"; then
              echo "the exclusion pattern '$pattern' matches no tracked file"
              ok=0
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')
          [ "$ok" = 1 ]
      - name: the runner's disk and memory, before the build
        run: df -h / | tail -1; free -m | awk 'NR==2'
      # A leaner instrumented build: no debuginfo (coverage needs the
      # coverage mapping, not DWARF), stripped binaries, and a linker
      # that keeps less of its working set in RAM. The agent that dies
      # is the largest process when the linker and the agent share a
      # 7 GB machine. The swap file gives the suite's tail somewhere to
      # go instead of the OOM killer.
      - name: lean build settings for the instrumented build
        run: |
          mkdir -p .cargo
          printf '[profile.dev]\ndebug = false\nstrip = true\n\n[profile.test]\ndebug = false\nstrip = true\n' > .cargo/config.toml
          echo "RUSTFLAGS=-C link-arg=-Wl,--no-keep-memory" >> "$GITHUB_ENV"
      - name: restore the last instrumented build
        id: restore-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: coverage-build-${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: coverage-build-${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}-
      # The image ships dozens of gigabytes of toolchains this job
      # never touches; they go.
      - name: free the runner's disk for the instrumented build
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/lib/jvm 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          # The image may already run a swap file (this one does);
          # only grow the machine when it has none.
          if [ -z "$(swapon --show)" ]; then
            if sudo fallocate -l 4G /covswap \
              && sudo chmod 600 /covswap \
              && sudo mkswap /covswap \
              && sudo swapon /covswap; then
              echo "a 4G swap file is on"
            else
              echo "the swap file did not come up; the build lives without it"
            fi
          fi
          swapon --show || true
          df -h / | tail -1; free -m | awk 'NR==2'
      # The measure proves which lines run, not how many random cases
      # pass: 16 cases each, where the test jobs run the case counts.
      - name: stale profiles go
        run: rm -f target/coverage/*.profraw target/coverage/*.profdata target/coverage/*-profraw-list
      - name: measure
        run: |
          set -o pipefail
          # The same watcher-guard the measure always had: no
          # SIGPIPE death, and a trip stops the measure while the log
          # can still say what ate the runner.
          rm -f guard.trip watcher.log watcher.ps
          # The absolute floors are late: a leak that eats the runner
          # kills its agent before 3G/600M arrive. The watch also
          # trips on GROWTH against this measure's own start, which
          # fires while there is still room to leave the evidence.
          start_avail=$(df --output=avail -BG / 2> /dev/null | tail -1 | tr -dc '0-9') || true
          start_mem=$(free -m 2> /dev/null | awk 'NR==2 {print $7}') || true
          # The agent can also die of a process or thread leak: servers a
          # test left behind pile up until the runner cannot fork. The
          # watch counts processes, threads and the store family every
          # tick, and trips on growth against this measure's own start.
          start_procs=$(ps -e --no-headers 2> /dev/null | wc -l | tr -d ' ') || true
          pgrep -c -f 'scion-(server|daemon|cache)' 2> /dev/null > /dev/null || true
          ( while sleep 10; do
              { date -u +%T; df -h / | tail -1; free -m | awk 'NR==2'; du -sh target/coverage 2>/dev/null; } || true
              { ps -eo pid,rss,pcpu,etime,comm --sort=-rss > watcher.ps && head -4 watcher.ps >> watcher.log; } || true
              procs=$(ps -e --no-headers 2> /dev/null | wc -l | tr -d ' ') || true
              threads=$(ps -eLo --no-headers 2> /dev/null | wc -l | tr -d ' ') || true
              family=$(pgrep -c -f 'scion-(server|daemon|cache)' 2> /dev/null) || true
              family=${family:-0}
              # shellcheck disable=SC2034
              echo "processes=$procs threads=$threads store_family=$family" >> watcher.log || true
              avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9' 2> /dev/null) || true
              mem=$(free -m | awk 'NR==2 {print $7}' 2> /dev/null) || true
              swap_used=$(free -m 2> /dev/null | awk 'NR==3 {print $3}') || true
              echo "procs=$procs threads=$threads family=$family mem_avail=${mem:-?}M swap_used=${swap_used:-?}M disk_avail=${avail:-?}G" || true
              avail_drop=0; mem_drop=0; proc_growth=0
              if [ -n "${avail:-}" ] && [ -n "${start_avail:-}" ]; then
                avail_drop=$((start_avail - avail))
              fi
              if [ -n "${mem:-}" ] && [ -n "${start_mem:-}" ]; then
                mem_drop=$((start_mem - mem))
              fi
              if [ -n "${procs:-}" ] && [ -n "${start_procs:-}" ]; then
                proc_growth=$((procs - start_procs))
              fi
              if [ "${avail:-10}" -le 3 ] || [ "${mem:-10000}" -le 600 ] || [ "$avail_drop" -ge 6 ] || [ "$mem_drop" -ge 4000 ] || [ "$proc_growth" -ge 500 ] || [ "$family" -ge 200 ]; then
                {
                  echo "the runner is out of disk or memory, or is leaking: avail=${avail:-?}G avail_floor=3G free_mem=${mem:-?}M mem_floor=600M disk_drop_since_start=${avail_drop:-?}G mem_drop_since_start=${mem_drop:-?}M processes=$procs (start ${start_procs:-?}, growth $proc_growth, floor +500) store_family=$family (floor 200) threads=$threads"
                  df -h / || true
                  free -m || true
                  { ps -eo pid,rss,pcpu,etime,comm,args --sort=-rss > watcher.top && head -14 watcher.top; } || true
                  { ps -eo ppid,comm | sort | uniq -c | sort -rn | head -10; } || true
                } | tee -a watcher.log
                # The reason goes to a file FIRST: the kill below takes
                # the measure's process group, and anything this
                # subshell only teed could die with the flush. The kill
                # reaches exactly the measure's own session (setsid
                # above): the negative pgid signals the wrapper, the
                # runner and every test process. A setsid that failed
                # would record the step's own group - the guard then
                # stands down rather than kill its family, and the
                # numbers below name that.
                printf 'trip at %s: avail=%s mem=%s disk_drop=%s mem_drop=%s pgid=%s step_pgid=%s\n' "$(date -u +%T)" "${avail:-?}" "${mem:-?}" "${avail_drop:-?}" "${mem_drop:-?}" "$(cat measure.pgid 2> /dev/null || echo none)" "$(ps -o pgid= -p $$ 2> /dev/null | tr -d ' ')" > guard.trip 2> /dev/null || true
                if [ -f measure.pgid ] && [ "$(ps -o pgid= -p "$(cat measure.pgid)" 2> /dev/null | tr -d ' ')" != "$(ps -o pgid= -p $$ 2> /dev/null | tr -d ' ')" ]; then
                  kill -TERM -- "-$(cat measure.pgid)" || true
                else
                  echo "the guard stands down: no separate measure group (setsid failed?)" >> guard.trip || true
                fi
                exit 2
              fi
            done ) &
          watcher=$!
          ulimit -v 6291456
          # shellcheck disable=SC1090
          source <(cargo llvm-cov show-env --sh)
          # The build set is the whole workspace, the same feature
          # unification as the gate: a -p build gives the crate a
          # different coverage mapping, and the gate's report drops the
          # -p side's counters as mismatched data (pg.rs read 6% while
          # its job ran 635 tests green - the split's artifact, not
          # missing tests). The run set is the whole workspace: the one
          # measure is what the gate checks, so every crate's tests run.
          LLVM_PROFILE_FILE=/dev/null nice -n 19 cargo nextest run \
            --workspace --no-run
          # The measure runs in its own process group (setsid): the
          # guard's trip kills that group by number, which reaches the
          # wrapper, the runner and every test process and nothing
          # else - no name pattern, nothing of the step or the watcher.
          sum="${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "postgres measure starts at $(date -u +%T)" >> "$sum" || true
          if nice -n 19 cargo nextest run --no-run --workspace > build-postgres.log 2>&1; then
            echo "postgres build ends at $(date -u +%T)" >> "$sum" || true
          else
            echo "the postgres build failed:"
            tail -40 build-postgres.log
            exit 1
          fi
          setsid bash -c 'echo $$ > measure.pgid; nice -n 19 env PROPTEST_CASES=16 cargo nextest run --profile coverage --workspace --no-fail-fast; echo $? > measure.rc' \
            | tee measure.log
          # The same end-of-step rules the measure always had.
          # One wait only: a second wait on the reaped job re-fires
          # the saved status and, under errexit, kills this step with
          # it - that was the exit-143 after every green measure. The
          # watcher ends three ways: 2 = it tripped (the file says
          # so below), 143 = the kill above, the normal shutdown,
          # anything else = a harness bug.
          kill "$watcher" 2> /dev/null || true
          watch_rc=0
          wait "$watcher" 2> /dev/null || watch_rc=$?
          if [ -f guard.trip ]; then
            echo 'the guard tripped: the measure above was stopped by it'
            tail -30 watcher.log
            exit 1
          fi
          if [ -f measure.rc ] && [ "$(cat measure.rc)" != "0" ]; then
            echo "the measure itself failed: nextest status $(cat measure.rc)"
            exit "$(cat measure.rc)"
          fi
          if [ "$watch_rc" -eq 143 ]; then
            echo 'the watcher was stopped by this step, as it should be'
          elif [ "$watch_rc" -eq 0 ]; then
            echo 'the watcher ran to the end, as it should be'
          else
            echo "the watcher exited early without tripping: status $watch_rc - a harness bug"
            tail -30 watcher.log
            exit 1
          fi
          # The report maps these bytes; no rebuild may touch them.
          # shellcheck disable=SC2046
          tar czf units-postgres.tgz $(find target/debug -type f -perm -u+x ! -name '*.d' ! -name '*.rlib' ! -name '*.so')
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
          # The backup and crash tests restart the job's own database, as
          # ci.yml's postgres job lets them: the container's id is the
          # handle.
          SCION_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
      - name: upload the measure's units
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-units
          retention-days: 1
          path: units-postgres.tgz
          if-no-files-found: error
      - name: upload the measure's profiles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: coverage-postgres
          path: target/coverage/*.profraw
          if-no-files-found: error
      - name: the measure's log, even on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measure-log
          path: measure.log
          if-no-files-found: ignore
      - name: the watcher's process samples, always
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watcher-postgres
          path: watcher.log
          if-no-files-found: ignore
  gate:
    name: coverage, the gate
    needs: [measure]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: llvm-tools-preview
      - name: the checked-in exclusions, as one regex
        run: |
          regex=$(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt \
            | grep -v '^$' | paste -s -d '|' -)
          if [ -n "$regex" ]; then
            echo "COVERAGE_IGNORE=$regex" >> "$GITHUB_ENV"
          fi
      - name: the measure's profiles and units
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: target/coverage
          merge-multiple: true
      - name: the measure's units, unpacked where a build would put them
        run: |
          # The tar carries the unit paths target/debug/...; the report
          # maps the counters against THE EXACT BYTES the tests ran.
          mkdir -p target/units-postgres
          tar xzf target/coverage/units-postgres.tgz -C target/units-postgres
          echo "postgres units: $(find target/units-postgres -type f | wc -l) files, $(du -sh target/units-postgres | cut -f1)"
      - name: the merged report, and the gate
        run: |
          set -o pipefail
          # The report maps the measure's raw counters against THE
          # EXACT BYTES those tests ran - no rebuild, no recompile, no
          # second copy of any unit. A rebuild was the whole bug: a
          # unit's mapping hash is build-specific, so the report could
          # never match the counters it was given, and silently dropped
          # them as mismatched data (pg.rs read 6% while its job ran
          # 635 tests green). With the units in hand the count is zero
          # by construction, and the assert below holds the line.
          # -quit, not head: a head-truncated find dies of SIGPIPE, and
          # pipefail turns that into a failed assignment (exit 141,
          # reported as 1) before the report ever starts.
          pd="$(find "$(rustc --print sysroot)" -type f -name llvm-profdata -print -quit)"
          lcv="$(find "$(rustc --print sysroot)" -type f -name llvm-cov -print -quit)"
          "$pd" merge -sparse target/coverage/*.profraw \
            -o target/coverage/merged.profdata
          # Every unit is a coverage object, passed as a repeated
          # -object flag. Bare paths would read as source filters: the
          # report would map the first binary and silently filter the
          # rest into nothing.
          objects=()
          while IFS= read -r f; do objects+=(-object "$f"); done \
            < <(find target/units-postgres -type f | sort)
          echo "coverage objects: $(( ${#objects[@]} / 2 ))"
          if ! "$lcv" report "${objects[@]}" \
            -instr-profile=target/coverage/merged.profdata \
            --summary-only \
            --ignore-filename-regex "$ignore_regex" \
            > target/coverage/report-summary.txt \
            2> target/coverage/report-stderr.txt; then
            echo "the report failed; its stderr:"
            cat target/coverage/report-stderr.txt
            exit 2
          fi
          cat target/coverage/report-stderr.txt
          # Guard 1: the assert at zero. A mismatch means the report
          # could not map a counter to the units at hand - the report
          # lies by omission (its lines read uncovered), so the run
          # fails rather than prints a number that was never true.
          # || true: grep exits 1 on no match, which is the SUCCESS case
          # (nothing dropped); -e would otherwise stop the script here.
          mismatches=$(grep -oE '[0-9]+ functions have mismatched data' \
            target/coverage/report-stderr.txt | grep -oE '[0-9]+' | head -1 || true)
          mismatches=${mismatches:-0}
          echo "profraw files: $(find target/coverage -maxdepth 1 -name "*.profraw" | wc -l)"
          echo "merged profdata bytes: $(wc -c < target/coverage/merged.profdata)"
          grep -m2 '^TOTAL' target/coverage/report-summary.txt || echo "(no TOTAL row)"
          echo "functions with mismatched data: $mismatches (assert: 0)"
          if [ "$mismatches" -gt 0 ]; then
            echo "the report dropped $mismatches functions; the number is not the truth"
            exit 2
          fi
          # Third-party sources stay out of the denominator. The
          # registry's build.rs files map into the report at 0% - the
          # measure discards build-phase profiles on purpose - and
          # nothing under .cargo or rustc's sysroot is ours to cover.
          # About three points of the total sat on 33 dependency
          # build.rs files; the exclusions file cannot hold these
          # patterns (its guard reads tracked paths only), so they
          # live here, beside the exclusions file's regex.
          # The denominator is product code only: test files run
          # almost all of their own lines and would push the percent
          # up (111 tests/ files read 90.9% on themselves); examples
          # are demos, not the product; the generated protobuf under
          # target/.../out/ is prost's output, the checked-in .proto
          # files are its source. An empty alternative in a regex
          # matches every path, so the exclusions join only when they
          # exist.
          ignore_regex='/tests/|/examples/|/target/debug/build/|/.cargo/registry/|/rustc/'
          [ -n "$COVERAGE_IGNORE" ] && ignore_regex="$COVERAGE_IGNORE|$ignore_regex"
          # The machine-checked numbers come from the JSON export: its
          # fields are named and stable, unlike the text table's column
          # positions, which move with the branch columns' presence.
          if ! "$lcv" export "${objects[@]}" \
            -instr-profile=target/coverage/merged.profdata \
            --summary-only \
            --ignore-filename-regex "$ignore_regex" \
            > target/coverage/report.json; then
            echo "the export failed"
            exit 2
          fi
          # An over-wide filter would print a number over almost
          # nothing; the workspace has hundreds of mapped files, so a
          # report with fewer than 50 is a filter that ate the code.
          mapped_files=$(jq -r '.data[0].files | length' target/coverage/report.json)
          echo "mapped source files: ${mapped_files:-none} (floor 50)"
          if [ -z "$mapped_files" ] || [ "$mapped_files" -lt 50 ]; then
            echo "the report maps too few files; a filter ate the code"
            exit 2
          fi
          total_lines=$(jq -r '.data[0].totals.lines.percent // "none"' target/coverage/report.json)
          echo "total lines covered: ${total_lines:-none}% (floor 80%)"
          case "$total_lines" in none|''|*[!0-9.]*) echo "the total is unreadable; the gate refuses a number it cannot read"; exit 2 ;; esac
          if [ "${total_lines%%.*}" -lt 80 ]; then
            echo "the total line coverage is under 80"
            exit 2
          fi
          # Guard 2: pg.rs's lines must be above a floor. pg.rs carries
          # the Postgres backend's code, and the one measure runs the
          # whole suite against Postgres, so a correct measure reads it
          # far above half. The floor is well under the reading, so a
          # lost profile still fails.
          pg_floor=45
          pg_cover=$(jq -r '[.data[0].files[] | select(.filename | endswith("crates/scion-server/src/pg.rs"))][0].summary.lines.percent // "none"' target/coverage/report.json)
          echo "pg.rs lines covered: ${pg_cover:-none}% (floor $pg_floor%)"
          case "$pg_cover" in none|''|*[!0-9.]*) echo "pg.rs is unreadable; the Postgres side of the merge may be missing"; exit 2 ;; esac
          if [ "${pg_cover%%.*}" -lt "$pg_floor" ]; then
            echo "pg.rs is below the floor; the Postgres side of the merge is missing"
            exit 2
          fi
          # The proof the filter applies: no excluded file may appear
          # in the export.
          while IFS= read -r pattern; do
            if grep -qE "$pattern" target/coverage/report.json; then
              echo "the report still shows a file matching the exclusion '$pattern'"
              exit 1
            fi
          done < <(sed 's/^[[:space:]]*//; s/#.*//; s/[[:space:]]*$//' scripts/coverage-exclusions.txt | grep -v '^$')

      - name: the report, kept for the record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
