# The measured restore time of docs/operations.md, section 3: a store of
# a stated size, restored and fscked, seconds printed. The runner label
# is the machine class the docs quote; this fixed image is the only
# machine the number comes from.
#
# No pull_request trigger on purpose: a restore time does not need to
# run per PR, and an edit to this file is not a workflow-lane PR that
# every open PR must merge. The same reason coverage.yml and bench.yml
# are their own files.

name: restore-bench
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  restore:
    name: restore time
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p open-scion-server --test restore_bench -- --ignored --nocapture
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
