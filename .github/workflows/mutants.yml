# Mutation runs for the security boundary, on CI runners: a dispatch
# names the files, the run flips one comparison or guard at a time
# (cargo-mutants), and the outcome lists upload as an artifact. A run
# never fills a developer's disk - the two local runs that caused disk
# emergencies are why this file exists (docs/production-audit.md 10,
# #961).
#
# No pull_request trigger on purpose: a mutation run is minutes-per-mutant
# by design, and no PR lane should pay for one. The same reason coverage,
# bench and soak are their own files.
#
# The timeout per mutant bounds a stuck mutant the way the runs in the
# audit's table were bounded; the outcomes land as an artifact either way,
# so a verdict session reads the lists without re-running anything.

name: mutants

on:
  workflow_dispatch:
    inputs:
      files:
        description: >-
          space-separated files to mutate, repo-relative, for example
          crates/scion-server/src/access.rs crates/scion-server/src/views.rs
        required: true
        type: string
      timeout_per_mutant:
        description: seconds one mutant's test run may take
        required: false
        default: "120"
        type: string
      job_timeout_minutes:
        description: minutes the whole run may take
        required: false
        default: "120"
        type: string
      test_args:
        description: >-
          args for cargo test after --, e.g. "--test access --test every_rpc_unauthenticated";
          default: the mutated package's whole test suite
        required: false
        default: ""
        type: string
      shard:
        description: >-
          this run's shard index, 0-based (cargo-mutants --shard k/n,
          valid k: 0..shards-1; k must be less than shards). Set both
          this and shards for a file whose mutant count cannot fit one
          job's timeout (#1008, listen.rs); leave both empty for a
          whole-file run.
        required: false
        default: ""
        type: string
      shards:
        description: the number of shards, n in --shard k/n; set with shard
        required: false
        default: ""
        type: string
      test_package:
        description: >-
          run this package's test targets alongside the mutated
          package's, via cargo-mutants -C --package=<name>, for mutants
          in one package whose killing tests live in another (#961's
          Bearer mutant, #1008's listen boundary: the proto's mutants
          against the server's suites). Empty runs the mutated package's
          tests only. Note: --test-package alone cannot do this - the
          baseline is pinned to the mutated package, so the named
          --test targets fail to resolve.
        required: false
        default: ""
        type: string
      exclude_re:
        description: >-
          a regex of mutants to skip, passed as cargo-mutants --exclude-re
          (#1107: a mutant whose test run kills the runner itself, so the
          run cannot carry it)
        required: false
        default: ""
        type: string
      as_cap_kb:
        description: >-
          each test binary's address-space cap in KiB, via prlimit --as on
          the Linux job (#1112): a runaway mutant then fails its own test
          instead of starving the runner. Default 8388608 (8 GiB): about
          3.7x the largest measured test binary (2.1 GiB) and half the
          runner's memory. An explicitly empty value runs without the cap.
        required: false
        default: "8388608"
        type: string
      measure_peak:
        description: >-
          measure each test binary's peak address space before the mutants
          start (#1112, for picking as_cap_kb). Off by default: an uncapped
          run does exactly what main does.
        required: false
        default: "false"
        type: boolean
      runner:
        description: >-
          the runner: ubuntu-24.04 (the default) with the Postgres service;
          macos-15 without it - for the modules whose killing tests are
          macOS-gated (the auth ACL code, #986). A macOS runner has no
          service containers, so the database cannot start there; a
          package whose tests open it cannot be mutated on this runner.
        required: false
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - macos-15

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The mutants' builds keep only line tables in their debug info: the
  # run builds the workspace once per worker, and lean debug info keeps
  # the runner's disk inside its budget (ci.yml's env does the same).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  mutants:
    name: mutants
    # One job per run: the runner input picks which. The Postgres
    # service cannot be conditional (no if on services), and a macOS
    # runner has no service containers at all, so the macOS shape is a
    # separate job without one.
    if: ${{ inputs.runner != 'macos-15' }}
    runs-on: ubuntu-24.04
    # The dispatch's number, fromJSON'd: timeout-minutes needs a number
    # and every input arrives a string.
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes || '120') }}
    services:
      # The auth and read-rule files' tests open the test database: the
      # backend the suites choose is Postgres, and the URL names the
      # database this service runs.
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: protoc
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-mutants@27.1.0
      # The workspace's generated gRPC code builds only with protoc; the
      # fuzz workflow installs it for the same reason.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the test binaries' peak address space
        # The peaks are measured before there is a cap; once the cap is
        # set, this step has nothing left to say.
        if: inputs.measure_peak
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
          SCION_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          TEST_ARGS: ${{ inputs.test_args }}
          TEST_PACKAGE: ${{ inputs.test_package }}
          FILES: ${{ inputs.files }}
        run: |
          # The cap in #1112 must sit well above a normal test binary's
          # peak address space (glibc's arenas reserve a lot of it), so
          # the baseline is measured on this runner, with each test
          # binary the run will use, before the cap is picked.
          pkg_args=""
          if [ -n "$TEST_PACKAGE" ]; then
            pkg_args="--package=$TEST_PACKAGE"
          else
            first_file=$(echo "$FILES" | cut -d' ' -f1)
            # The file's crate: walk up to the nearest Cargo.toml, whatever
            # the depth under src/.
            crate_dir=$(dirname "$first_file")
            while [ ! -f "$crate_dir/Cargo.toml" ]; do
              crate_dir=$(dirname "$crate_dir")
            done
            pkg_args="--manifest-path=$crate_dir/Cargo.toml"
          fi
          mkdir -p mutants-measure
          # shellcheck disable=SC2086
          cargo test $pkg_args $TEST_ARGS --no-run --message-format=json \
            > mutants-measure/build.json
          jq -r 'select(.executable != null) | .executable' mutants-measure/build.json \
            | sort -u > mutants-measure/bins.txt
          while IFS= read -r bin; do
            [ -n "$bin" ] || continue
            bash -c '
              "$1" > /dev/null 2>&1 & p=$!
              peak=0
              while kill -0 $p 2>/dev/null; do
                v=$(awk "/VmPeak/{print \$2}" /proc/$p/status 2>/dev/null)
                [ -n "$v" ] && peak=$v
                sleep 0.5
              done
              wait $p; rc=$?
              echo "$(basename "$1"): VmPeak ${peak} KiB (exit $rc)"
            ' _ "$bin"
          done < mutants-measure/bins.txt
      - name: the mutation run
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
          # A suite that dumps the live metadata (storage's restore runbook)
          # does it with this job's own Postgres, so its tools match the
          # server (#1099).
          SCION_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          FILES: ${{ inputs.files }}
          MUTANT_TIMEOUT: ${{ inputs.timeout_per_mutant }}
          TEST_ARGS: ${{ inputs.test_args }}
          SHARD: ${{ inputs.shard }}
          SHARDS: ${{ inputs.shards }}
          EXCLUDE_RE: ${{ inputs.exclude_re }}
          TEST_PACKAGE: ${{ inputs.test_package }}
          AS_CAP_KB: ${{ inputs.as_cap_kb }}
        run: |
          # The dispatch names files, one per -f: cargo-mutants examines
          # only those files' functions. Every name must be a file in the
          # tree, so a typo fails the run instead of mutating nothing.
          set -eu
          file_args=""
          # shellcheck disable=SC2086
          for f in $FILES; do
            [ -f "$f" ] || { echo "not a file: $f"; exit 2; }
            file_args="$file_args -f $f"
          done
          df -h /
          if { [ -n "$SHARD" ] && [ -z "$SHARDS" ]; } || { [ -z "$SHARD" ] && [ -n "$SHARDS" ]; }; then
            echo "error: set both shard and shards, or neither (got one)" >&2
            exit 1
          fi
          shard_args=""
          if [ -n "$SHARD" ] && [ -n "$SHARDS" ]; then
            shard_args="--shard $SHARD/$SHARDS"
          fi
          mutants_args=""
          if [ -n "$TEST_PACKAGE" ]; then
            mutants_args="-C --package=$TEST_PACKAGE"
          fi
          exclude_args=()
          if [ -n "$EXCLUDE_RE" ]; then
            exclude_args=(--exclude-re "$EXCLUDE_RE")
          fi
          # A test binary whose address space the cap ends fails its own
          # test, instead of starving the runner until GitHub cancels the
          # job (#1112). prlimit exists on the Linux runner only. --as
          # reads bytes, not the KiB the input names.
          case "$AS_CAP_KB" in
            '') ;;
            *[!0-9]*) echo "as_cap_kb must be digits" >&2; exit 1 ;;
            *) cap_bytes=$((AS_CAP_KB * 1024))
              echo "the test runner's address-space cap: $cap_bytes bytes"
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="prlimit --as=$cap_bytes" ;;
          esac
          # shellcheck disable=SC2086
          # An empty array under `set -u` reads as unbound on bash 3.2.
          cargo mutants --no-shuffle --timeout "$MUTANT_TIMEOUT" --output mutants-out $mutants_args $file_args $shard_args ${exclude_args[@]+"${exclude_args[@]}"} -- $TEST_ARGS
          df -h /
      - name: the outcome lists
        if: always()
        run: |
          # The lists a verdict session reads, under the run's own
          # mutants.out: missed (a gap or an equivalent mutant), timeout,
          # caught. cargo-mutants --output DIR creates DIR/mutants.out,
          # so the real paths carry the extra level. A run that got past
          # the build always wrote them; their absence is a bug and
          # fails here instead of reading as "(none) missed".
          set -eu
          lists=mutants-out/mutants.out
          for list in missed.txt caught.txt timeout.txt outcomes.json; do
            [ -f "$lists/$list" ] || {
              echo "the run wrote no $lists/$list"; ls -la "$lists" || true; exit 2;
            }
          done
          {
            printf 'missed: %s\n' "$(grep -c '^' "$lists/missed.txt")"
            printf 'timeout: %s\n' "$(grep -c '^' "$lists/timeout.txt")"
            printf 'caught: %s\n' "$(grep -c '^' "$lists/caught.txt")"
            printf '\nmissed mutants:\n'
            cat "$lists/missed.txt"
          } > mutants-out/summary.txt
          cat mutants-out/summary.txt
      - name: upload the outcome lists
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ github.run_id }}
          path: mutants-out/
          if-no-files-found: error

  mutants-macos:
    name: mutants (macOS)
    # The macOS twin: no Postgres service (a macOS runner has no service
    # containers), no database URL - a package whose tests open the
    # database cannot be mutated here. Exists for the modules whose
    # killing tests are macOS-gated: the auth ACL code (#986, #961's
    # F5: 42 mutants the Linux run cannot reach).
    if: ${{ inputs.runner == 'macos-15' }}
    runs-on: macos-15
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes || '120') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: protoc
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: cargo-mutants@27.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the mutation run
        env:
          FILES: ${{ inputs.files }}
          MUTANT_TIMEOUT: ${{ inputs.timeout_per_mutant }}
          TEST_ARGS: ${{ inputs.test_args }}
          SHARD: ${{ inputs.shard }}
          SHARDS: ${{ inputs.shards }}
          EXCLUDE_RE: ${{ inputs.exclude_re }}
          TEST_PACKAGE: ${{ inputs.test_package }}
        run: |
          set -eu
          file_args=""
          # shellcheck disable=SC2086
          for f in $FILES; do
            [ -f "$f" ] || { echo "not a file: $f"; exit 2; }
            file_args="$file_args -f $f"
          done
          df -h /
          if { [ -n "$SHARD" ] && [ -z "$SHARDS" ]; } || { [ -z "$SHARD" ] && [ -n "$SHARDS" ]; }; then
            echo "error: set both shard and shards, or neither (got one)" >&2
            exit 1
          fi
          shard_args=""
          if [ -n "$SHARD" ] && [ -n "$SHARDS" ]; then
            shard_args="--shard $SHARD/$SHARDS"
          fi
          mutants_args=""
          if [ -n "$TEST_PACKAGE" ]; then
            mutants_args="-C --package=$TEST_PACKAGE"
          fi
          exclude_args=()
          if [ -n "$EXCLUDE_RE" ]; then
            exclude_args=(--exclude-re "$EXCLUDE_RE")
          fi
          # shellcheck disable=SC2086
          # An empty array under `set -u` reads as unbound on bash 3.2.
          cargo mutants --no-shuffle --timeout "$MUTANT_TIMEOUT" --output mutants-out $mutants_args $file_args $shard_args ${exclude_args[@]+"${exclude_args[@]}"} -- $TEST_ARGS
          df -h /
      - name: the outcome lists
        if: always()
        run: |
          set -eu
          lists=mutants-out/mutants.out
          for list in missed.txt caught.txt timeout.txt outcomes.json; do
            [ -f "$lists/$list" ] || {
              echo "the run wrote no $lists/$list"; ls -la "$lists" || true; exit 2;
            }
          done
          {
            printf 'missed: %s\n' "$(grep -c '^' "$lists/missed.txt")"
            printf 'timeout: %s\n' "$(grep -c '^' "$lists/timeout.txt")"
            printf 'caught: %s\n' "$(grep -c '^' "$lists/caught.txt")"
            printf '\nmissed mutants:\n'
            cat "$lists/missed.txt"
          } > mutants-out/summary.txt
          cat mutants-out/summary.txt
      - name: upload the outcome lists
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ github.run_id }}
          path: mutants-out/
          if-no-files-found: error
