name: bench

# The checkout benchmark (issue #6): 50 parallel sparse checkouts through
# one scion-daemon, against git in three ways, on the fixed public dataset.
# Runs only when a person asks, never on pushes, pull requests or a
# schedule: shared runners are noisy, and the min and max columns in the
# output are how that shows.
on:
  workflow_dispatch:
    inputs:
      # The blob-count measurement (issue #823): a space-separated list
      # of blob counts. When it is set, the checkout and capacity jobs
      # are skipped and the blob-count job runs the stores' costs.
      blob_counts:
        description: blob counts to measure (space-separated); set to run the blob-count job
        default: ""
      profile:
        description: "Profile one land instead of the envelope jobs."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  checkout:
    if: ${{ !inputs.profile && github.event.inputs.blob_counts == '' }}
    name: checkout vs git clone
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      # The bench's server keeps its metadata in Postgres, in the schema
      # pg_url_for names for its data dir.
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release
      # pipefail: the benchmark's exit code is the run's verdict (it checks
      # that every job wrote the same files), and the tee must not eat it.
      - name: the facts of the run
        run: |
          {
            echo "scion commit: $(git rev-parse HEAD)"
            echo "git: $(git --version)"
            echo "cores: $(nproc)"
            echo "kernel: $(uname -r)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: run the checkout benchmark
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
        run: |
          set -o pipefail
          SCION_KEEP_LOGS="$RUNNER_TEMP/bench-logs" \
            scripts/bench-checkout.sh 2>&1 | tee "$RUNNER_TEMP/bench-output.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: upload the raw output and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-checkout-output
          path: |
            ${{ runner.temp }}/bench-output.txt
            ${{ runner.temp }}/bench-logs/
          if-no-files-found: error

  # The capacity envelope (issue #387): one server over a grid of
  # writers, readers and backends, until the published table is full.
  # Dispatch only, like the checkout benchmark: a shared runner is
  # noisy, and the doc's table carries that in its caption. The
  # Postgres cells need SCION_PG_URL, which the service container
  # below provides.
  capacity:
    if: ${{ !inputs.profile && github.event.inputs.blob_counts == '' }}
    name: capacity envelope
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The full history: the run's footer names its commit, and the
      # doc test verifies a named commit exists in a full clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: run the capacity grid
        env:
          # The harness drops and creates its databases, so it runs
          # only on a scion_capacity_* database.
          SCION_PG_URL: postgres://postgres@127.0.0.1:5432/scion_capacity_grid
          CAPACITY_MACHINE: "GitHub ubuntu-24.04 hosted runner: 4 vCPU, 16 GiB RAM, ~144 GiB SSD"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/capacity.sh
      - name: upload the raw output and the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capacity-artifacts
          path: ${{ runner.temp }}/capacity-artifacts/
          if-no-files-found: error

  # The blob-count costs (issue #823): stores of small blobs at the
  # counts the dispatch input names, each measured for the server's
  # open, fsck, gc --dry-run, bytes on disk and inodes. Dispatch only:
  # a run of millions of blobs takes tens of minutes on a fixed runner.
  blob-count:
    if: github.event.inputs.blob_counts != ''
    name: blob-count costs
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      # The stores open through the test backend, whose Postgres half
      # reads this database.
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: scion
          POSTGRES_DB: scion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the facts of the run
        run: |
          {
            echo "scion commit: $(git rev-parse HEAD)"
            echo "cores: $(nproc)"
            echo "kernel: $(uname -r)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: the blob-count costs
        env:
          SCION_TEST_POSTGRES_URL: postgres://postgres:scion@localhost:5432/scion
          SCION_BENCH_COUNTS: ${{ github.event.inputs.blob_counts }}
          SCION_BENCH_WORK: ${{ runner.temp }}/blob-bench
        run: |
          set -o pipefail
          scripts/bench-blob-count.sh 2>&1 | tee "$RUNNER_TEMP/blob-count-output.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: upload the raw output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-count-output
          path: ${{ runner.temp }}/blob-count-output.txt
          if-no-files-found: error

  land-profile:
    name: land profile
    if: ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # pg_stat_statements needs a shared preload, so this job is not
      # the envelope's services block: a service's options are docker
      # flags, and the preload is a server argument. The job runs its
      # own postgres, with the preload on the server command line.
      - name: the profile's postgres, with the preload on the command line
        run: |
          set -euo pipefail
          docker run -d --name profile-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=scion -e POSTGRES_DB=scion_capacity_profile \
            postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe \
            postgres -c shared_preload_libraries=pg_stat_statements
          for i in $(seq 1 60); do
            if docker exec profile-pg pg_isready -U postgres > /dev/null 2>&1; then
              echo "postgres is ready" && exit 0
            fi
            sleep 2
          done
          docker logs profile-pg || true
          echo "postgres did not get ready" >&2 && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: protoc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: the harness needs jq
        run: |
          set -euo pipefail
          command -v jq > /dev/null || sudo apt-get install -y -qq jq
      - name: the job's postgres stops last
        if: always()
        run: docker rm -f profile-pg || true
      - name: profile one land
        env:
          # The harness drops and creates its database, so it runs
          # only on a scion_capacity_* database.
          SCION_PG_URL: postgres://postgres:scion@127.0.0.1:5432/scion_capacity_profile
          CAPACITY_MACHINE: "GitHub ubuntu-24.04 hosted runner: 4 vCPU, 16 GiB RAM, ~144 GiB SSD"
        run: scripts/land-profile.sh
      - name: upload the raw output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: land-profile-artifacts
          path: ${{ runner.temp }}/land-profile-artifacts/
          if-no-files-found: error
