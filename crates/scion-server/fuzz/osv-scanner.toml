# Scorecard's Vulnerabilities check (floor 10) runs OSV-Scanner, which
# reads this file: ignore vulnerabilities by ID here, next to this
# directory's own Cargo.lock (the scanner looks for the config only in
# the scanned lock's own folder). The nine heapless 0.8.0 unsoundness
# advisories ride in
# through gix-hash -> faster-hex 0.10.1, whose only use of heapless
# (src/encode.rs:13) is cfg(not(feature = "alloc")), and gix-hash turns
# faster-hex's alloc feature on, so the unsound code is compiled out.
# faster-hex 1.x makes heapless optional, but no gix-hash release uses
# it yet. Remove these when gix-hash moves to faster-hex 1.x, or when
# heapless 0.8 gets a fixed release (deny.toml carries the same
# ignores).
[[IgnoredVulns]]
id = "RUSTSEC-2026-0574"
effectiveUntil = 2027-01-31
reason = "heapless 0.8.0 via faster-hex 0.10.1: the unsound code is cfg'd out (gix-hash enables faster-hex/alloc)"
